name: Build 17-32
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Model tayyorlash (nsfw.tflite)
        env:
          MODEL_URL: ${{ vars.MODEL_URL }}
          TF_USE_LEGACY_KERAS: "1"
        run: |
          if [ -f nsfw.tflite ]; then
            echo "Repo ichidagi nsfw.tflite ishlatiladi"
          elif [ -n "$MODEL_URL" ]; then
            curl -L --fail "$MODEL_URL" -o nsfw.tflite
          else
            pip install "tensorflow==2.15.1" "tf-keras==2.15.1" "tensorflow-hub==0.16.1"
            ok=0
            for u in \
              "https://github.com/GantMan/nsfw_model/releases/download/1.1.0/nsfw_mobilenet2.224x224.h5" \
              "https://github.com/GantMan/nsfw_model/raw/master/nsfw_mobilenet2.224x224.h5" \
              "https://s3.amazonaws.com/ir_public/nsfwjscdn/nsfw_mobilenet2.224x224.h5"; do
              echo "Urinish: $u"
              if curl -L --fail --retry 2 -o nsfw.h5 "$u"; then ok=1; break; fi
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Model yuklab bo'lmadi. nsfw.tflite ni repo ildiziga yuklang yoki MODEL_URL o'zgaruvchisini kiriting."
              exit 1
            fi
            python tools/make_model.py nsfw.h5 nsfw.tflite
          fi
          ls -la nsfw.tflite

      - name: Capacitor loyihasi
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          npx cap add android
          python3 tools/apply_native.py
          npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: 17-32-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
