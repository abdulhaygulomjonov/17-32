name: Build 17-32
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: NudeNet modeli (nudenet.onnx)
        env:
          NUDENET_URL: ${{ vars.NUDENET_URL }}
        run: |
          URL="${NUDENET_URL:-https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/320n.onnx}"
          if [ -f nudenet.onnx ]; then
            echo "Repo ichidagi nudenet.onnx ishlatiladi"
          elif curl -L --fail "$URL" -o nudenet.onnx; then
            ls -la nudenet.onnx
          else
            rm -f nudenet.onnx
            echo "::warning::nudenet.onnx yuklanmadi, eski nsfw.tflite modeliga o'tiladi"
          fi

      - name: Zaxira model (nsfw.tflite)
        env:
          MODEL_URL: ${{ vars.MODEL_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          TF_USE_LEGACY_KERAS: "1"
        run: |
          if [ -f nudenet.onnx ]; then
            echo "NudeNet bor, nsfw.tflite kerak emas"
            exit 0
          fi
          if [ -f nsfw.tflite ]; then
            echo "Repo ichidagi nsfw.tflite ishlatiladi"
          elif [ -n "$MODEL_URL" ]; then
            curl -L --fail "$MODEL_URL" -o nsfw.tflite
          else
            pip install "tensorflow==2.15.1" "tf-keras==2.15.1" "tensorflow-hub==0.16.1"
            python tools/fetch_model.py
          fi
          ls -la nsfw.tflite

      - name: Capacitor loyihasi
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          npx cap add android
          python3 tools/apply_native.py
          npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: 17-32-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
