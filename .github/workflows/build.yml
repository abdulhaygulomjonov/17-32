name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web fayllar
        run: |
          mkdir -p www native
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          unzip -o native.zip -d native
          mkdir -p native/assets
          if [ -f model/nsfw.tflite ]; then cp model/nsfw.tflite native/assets/; cp -f model/nsfw_labels.txt native/assets/ 2>/dev/null || true; else echo "::warning::model/nsfw.tflite topilmadi - rasm filtri model bo'lmaguncha ishlamaydi"; fi
      - name: Rasm filtri modeli
        continue-on-error: true
        run: |
          if [ -f native/assets/nsfw.tflite ]; then echo "model repoda tayyor"; else
            pip install "tensorflow==2.15.1" "tensorflow-hub==0.16.1" "numpy<2"
            python3 tools/make_model.py || echo "::warning::model yaratilmadi - rasm filtri ishlamaydi (model/nsfw.tflite ni qo'lda qo'ying)"
          fi
      - run: npm install
      - run: npx cap add android
      - name: Native kod
        run: python3 native/inject.py
      - name: Ikonka
        run: |
          pip install pillow
          python3 -c "
          from PIL import Image
          import os
          R = 'android/app/src/main/res'
          for n, s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              im = Image.open('icon-512.png').convert('RGBA').resize((s, s), Image.LANCZOS)
              for f in ('ic_launcher','ic_launcher_round','ic_launcher_foreground'):
                  im.save(R + '/mipmap-' + n + '/' + f + '.png')
          "
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - name: Imzo kaliti
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: versionCode
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: APK yigish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
