<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>17-32</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#eceff4; --muted:#8b93a1; --ok:#35c46a; --bad:#ef5350; --accent:#4c8dff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Roboto,sans-serif;
         padding: calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px); }
  h1 { font-size:32px; margin:0 0 28px; text-align:center; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; text-align:center; }
  .state { text-align:center; font-size:16px; margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  #msg { min-height:44px; color:#ffb74d; font-size:14px; text-align:center; margin:8px 4px 18px; }
  button { width:100%; border:0; border-radius:14px; padding:18px; font-size:18px; font-weight:600; margin-top:12px;
           background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  button.stop { background:#3a2326; color:#ff8a80; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-top:28px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:4px 0; font-size:16px; }
  .hint { color:var(--muted); font-size:13px; }
  input[type=search] { width:100%; margin:12px 0 6px; padding:12px; border-radius:12px; border:0; background:#2a2f3a; color:var(--text); font-size:15px; }
  .app { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid #262a33; }
  .app .info { min-width:0; flex:1; }
  .app .nm { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lk { font-size:13px; color:#ffb74d; margin-top:2px; }
  .ctl { flex:1 1 100%; display:flex; flex-direction:column; gap:8px; }
  .tp { display:flex; gap:8px; }
  .tp label { flex:1; font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
  select { background:#2a2f3a; color:var(--text); border:0; border-radius:10px; padding:8px; font-size:14px; width:100%; }
  .tail { display:flex; gap:8px; }
  .tail select { flex:1; }
  .ctl button { margin:0; padding:9px 14px; font-size:14px; width:auto; flex:1; background:#2a2f3a; color:var(--text); }
  .over { color:var(--bad); }
  input[type=password] { width:100%; margin:12px 0 6px; padding:12px; border-radius:12px; border:0; background:#2a2f3a; color:var(--text); font-size:18px; text-align:center; }
  #pw { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); align-items:center; justify-content:center; z-index:9; }
  #pw .card { width:86%; margin:0; }
  #dbg { display:none; white-space:pre-wrap; word-break:break-all; font-size:11px; color:#9aa; margin-top:20px;
         padding:8px; border:1px dashed #445; border-radius:8px; }
</style>
</head>
<body>
  <h1 id="title">17-32</h1>

  <div class="state"><span class="dot" id="d-run"></span><span id="state">Tekshirilmoqda...</span></div>
  <div id="msg"></div>

  <button id="b-start">Tizimni ishga tushirish</button>
  <button id="b-stop" class="stop">Tizimni o'chirish</button>

  <div id="pw"><div class="card">
    <div id="pw-t">Parolni kiriting</div>
    <input id="pw-i" type="password" inputmode="numeric" autocomplete="off">
    <button id="pw-ok">Tasdiqlash</button>
    <button id="pw-no" class="stop">Bekor qilish</button>
  </div></div>

  <div class="card">
    <div class="row"><span>Ilova limitlari</span></div>
    <input type="search" id="q" placeholder="Ilova qidirish...">
    <div id="apps"></div>
  </div>

  <pre id="dbg"></pre>

<script>
  const G = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Guard) || null;
  const $ = id => document.getElementById(id);
  const say = t => { $('msg').textContent = t || ''; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const ERR = {
    accessibility: "Avval Accessibility'da 17-32 ni yoqing.",
    model: "Model ilovada yo'q.",
    denied: "Ekran yozish ruxsati berilmadi. \"Butun ekran\" ni tanlang."
  };

  // Ruxsatlar tartibi: har bosishda faqat bittasi so'raladi
  const ORDER = [
    { k: 'accessibility', t: "Accessibility", h: "Ro'yxatdan 17-32 ni topib yoqing." },
    { k: 'notifications', t: "Bildirishnomalar", h: "Bildirishnomalarni yoqing." },
    { k: 'overlay', t: "Boshqa ilovalar ustida ko'rsatish", h: "Ruxsatni yoqing." },
    { k: 'battery', t: "Batareya cheklovsiz", h: "Cheklovsiz rejimga ruxsat bering." },
    { k: 'bgpopup', t: "Fonda ochiladigan oynalar", h: "Ruxsatni yoqing.", xiaomi: true },
    { k: 'usage', t: "Foydalanish statistikasi", h: "17-32 ni topib yoqing." }
  ];

  function nextMissing(st) {
    for (const p of ORDER) {
      if (p.xiaomi) { if (!(st.xiaomi && st.bgpopup === false)) continue; }
      else if (st[p.k]) continue;
      return p;
    }
    return null;
  }

  let flow = false, waitingFor = null, hiddenSeen = false, busy = false, bootWait = 0, vpnTried = false;

  async function step() {
    if (!G || busy) return;
    busy = true;
    try {
      let st = await G.getPermissions();
      let p = nextMissing(st);
      if (p && waitingFor === p.k) {
        // sozlamadan qaytildi: ruxsat tizimda qo'llanishiga ozgina vaqt beramiz
        await sleep(1000);
        st = await G.getPermissions();
        p = nextMissing(st);
      }
      if (p) {
        if (waitingFor === p.k) {
          flow = false; waitingFor = null;
          say(p.t + " yoqilmadi. Qayta urinish uchun \"Tizimni ishga tushirish\" ni bosing.");
          return;
        }
        waitingFor = p.k;
        hiddenSeen = false;
        say(p.t + ": " + p.h + " So'ng ilovaga qayting.");
        await G.openPermission({ name: p.k });
        return;
      }
      flow = false; waitingFor = null;
      try {
        // 1) qurilma administratori: ilovani parolsiz o'chirib bo'lmaydi
        say("Qurilma administratori: 17-32 ni faollashtiring.");
        try { await G.requestAdmin(); } catch (e) { say("Administrator yoqilmadi: ilovani o'chirishdan himoya ishlamaydi."); await sleep(1800); }
        // 2) DNS filtr (VPN): bir martalik tizim ruxsati
        say("DNS himoya: VPN so'roviga \"OK\" ni bosing.");
        try { await G.startVpn(); } catch (e) { say("DNS himoya yoqilmadi."); await sleep(1800); }
        say('Tizim yoqilmoqda...');
        await G.startProtection();
        say('Tizim ishga tushdi.');
      } catch (e) {
        const m = String(e.message || e);
        say((ERR[m] || ERR[m.split(' ')[0]] || '') + ' [' + m + ']');
      }
    } catch (e) {
      flow = false; waitingFor = null;
      say(String(e.message || e));
    } finally {
      busy = false;
      setTimeout(refresh, 1200);
    }
  }

  $('b-start').onclick = () => {
    if (!G) { say("Bu sahifa faqat ilova ichida ishlaydi."); return; }
    say('');
    flow = true; waitingFor = null; hiddenSeen = false;
    step();
  };

  function askPassword(title) {
    return new Promise(res => {
      const m = $('pw'), i = $('pw-i');
      $('pw-t').textContent = title;
      i.value = '';
      m.style.display = 'flex';
      setTimeout(() => i.focus(), 100);
      const done = v => { m.style.display = 'none'; $('pw-ok').onclick = null; $('pw-no').onclick = null; res(v); };
      $('pw-ok').onclick = () => done(i.value);
      $('pw-no').onclick = () => done(null);
    });
  }
  function pwError(e) {
    const m = String(e.message || e);
    if (m === 'parol') return "Parol noto'g'ri.";
    if (m === 'kutish') return "Ko'p marta xato kiritildi. 1 daqiqadan keyin urinib ko'ring.";
    return m;
  }

  $('b-stop').onclick = async () => {
    const pw = await askPassword("Tizimni o'chirish uchun parolni kiriting");
    if (pw === null) return;
    flow = false; waitingFor = null;
    say('');
    if (G) {
      try { await G.stopProtection({ password: pw }); say("Tizim o'chirildi."); } catch (e) { say(pwError(e)); }
    }
    setTimeout(refresh, 600);
  };

  // sozlamalardan qaytganda keyingi ruxsatga o'tadi
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenSeen = true; return; }
    refresh();
    if (flow && hiddenSeen) { hiddenSeen = false; setTimeout(step, 400); }
  });

  async function refresh() {
    if (!G) { $('state').textContent = "Faqat ilova ichida ishlaydi"; return; }
    try {
      const s = await G.getStatus();
      // telefon qayta yoqilgandan keyin: ekran yozish ruxsatini o'zi so'raydi
      if (s.autostart && !busy) {
        if (s.running) { bootWait = 0; await G.consumeAutostart(); }
        else if (s.accessibility || ++bootWait > 5) {   // accessibility ulanishini ~15 s kutadi
          bootWait = 0;
          await G.consumeAutostart();
          if (s.accessibility) { flow = true; waitingFor = null; hiddenSeen = false; step(); }
        }
      }
      // DNS filtr o'chib qolgan bo'lsa (masalan boshqa VPN yoqilgan), qayta yoqamiz
      if (s.vpn) vpnTried = false;
      else if (s.armed && s.accessibility && !busy && !vpnTried) {
        vpnTried = true;
        try { await G.startVpn(); } catch (e) { }
      }
      const on = !!(s.running && s.accessibility);
      $('d-run').classList.toggle('on', on);
      $('state').textContent = on ? (s.vpn ? "Tizim ishlayapti" : "Tizim ishlayapti (DNS himoya o'chiq)") : "Tizim o'chiq";
      if (s.error && !flow) say('Xato: ' + s.error);
      $('dbg').textContent = 'Diagnostika\n' + (s.log || "(log bo'sh)");
    } catch (e) { say(String(e.message || e)); }
  }

  // Diagnostika: sarlavhani 5 marta bosing
  let taps = 0, tapT = 0;
  $('title').onclick = () => {
    const now = Date.now();
    taps = now - tapT < 1500 ? taps + 1 : 1; tapT = now;
    if (taps >= 5) { taps = 0; const d = $('dbg'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
  };


  // ---- Ilova limitlari ----
  let APPS = [];
  const SPAN = {};
  const fmt = t => {
    t = Math.max(0, Math.round(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sc = t % 60;
    const p = [];
    if (h) p.push(h + ' s');
    if (m) p.push(m + ' daq');
    if (sc || !p.length) p.push(sc + ' son');
    return p.join(' ');
  };
  function usageText(a) {
    if (!a.limit) return 'Bugun: ' + fmt(a.usedSec);
    const left = a.limit - a.usedSec;
    return 'Bugun: ' + fmt(a.usedSec) + ' · ' + (left > 0 ? 'qoldi: ' + fmt(left) : 'limit tugadi');
  }
  const DAYS = [[7, '7 kun'], [21, '21 kun'], [40, '40 kun']];
  const dayText = ms => Math.ceil(ms / 86400000) + ' kun';

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const box = $('apps');
    box.textContent = '';
    APPS.filter(a => !q || a.name.toLowerCase().includes(q)).forEach(a => {
      const row = document.createElement('div'); row.className = 'app';
      const info = document.createElement('div'); info.className = 'info';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = a.name;
      const u = document.createElement('div'); u.className = 'hint'; u.textContent = usageText(a);
      u.classList.toggle('over', a.limit > 0 && a.usedSec >= a.limit);
      SPAN[a.pkg] = u;
      info.appendChild(nm); info.appendChild(u);
      row.appendChild(info);

      if (a.lockLeftMs > 0) {
        const lk = document.createElement('div'); lk.className = 'lk';
        lk.textContent = "Limit qulflangan: " + dayText(a.lockLeftMs) + " qoldi";
        info.appendChild(lk);
        box.appendChild(row);
        return;
      }

      const ctl = document.createElement('div'); ctl.className = 'ctl';
      const tp = document.createElement('div'); tp.className = 'tp';
      const cur = a.limit || 0;
      const mk = (label, max, val) => {
        const lb = document.createElement('label'); lb.textContent = label;
        const sl = document.createElement('select');
        for (let i = 0; i <= max; i++) {
          const op = document.createElement('option');
          op.value = i; op.textContent = String(i); op.selected = i === val;
          sl.appendChild(op);
        }
        lb.appendChild(sl); tp.appendChild(lb);
        return sl;
      };
      const hs = mk('Soat', 23, Math.floor(cur / 3600));
      const ms = mk('Daqiqa', 59, Math.floor((cur % 3600) / 60));
      const ss = mk('Soniya', 59, cur % 60);
      const tail = document.createElement('div'); tail.className = 'tail';
      const dsel = document.createElement('select');
      DAYS.forEach(o => {
        const op = document.createElement('option');
        op.value = o[0]; op.textContent = 'Qulf: ' + o[1];
        dsel.appendChild(op);
      });
      const btn = document.createElement('button');
      btn.textContent = "Qo'yish";
      const total = () => parseInt(hs.value, 10) * 3600 + parseInt(ms.value, 10) * 60 + parseInt(ss.value, 10);
      const sync = () => { tail.style.display = (total() === 0 && !a.limit) ? 'none' : 'flex'; };
      [hs, ms, ss].forEach(e => { e.onchange = sync; });
      sync();
      btn.onclick = async () => {
        const secs = total(), days = parseInt(dsel.value, 10);
        if (!G) return;
        if (secs > 0 && !confirm(a.name + ': kuniga ' + fmt(secs) + ' limit.\n' + days +
            " kun davomida uni o'zgartirib yoki olib tashlab bo'lmaydi. Davom etasizmi?")) return;
        try {
          await G.setLimit({ pkg: a.pkg, seconds: secs, days: days });
          say('');
        } catch (e) {
          say(String(e.message || e) === 'locked' ? "Limit qulflangan, muddati tugaguncha o'zgartirib bo'lmaydi." : String(e.message || e));
        }
        loadApps();
      };
      tail.appendChild(dsel); tail.appendChild(btn);
      ctl.appendChild(tp); ctl.appendChild(tail);
      row.appendChild(ctl);
      box.appendChild(row);
    });
  }

  async function loadApps() {
    if (!G) return;
    try {
      const r = await G.getApps();
      APPS = r.apps || [];
      render();
    } catch (e) { say(String(e.message || e)); }
  }

  async function updateUsage() {
    if (!G || document.hidden) return;
    try {
      const r = await G.getApps();
      (r.apps || []).forEach(n => {
        const a = APPS.find(x => x.pkg === n.pkg);
        if (!a) return;
        a.usedSec = n.usedSec;
        if ((a.lockLeftMs > 0) !== (n.lockLeftMs > 0)) { loadApps(); }
        const u = SPAN[a.pkg];
        if (u) { u.textContent = usageText(a); u.classList.toggle('over', a.limit > 0 && a.usedSec >= a.limit); }
      });
    } catch (e) { }
  }

  $('q').oninput = render;
  setInterval(updateUsage, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadApps(); });
  loadApps();

  setInterval(() => { if (!document.hidden) refresh(); }, 3000);
  refresh();
</script>
</body>
</html>
